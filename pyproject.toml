[project]
name = "copier-python-template"
version = "1.0.0"
description = "Modern Copier template for Python projects with UV, Pyright strict, and FastAPI"
requires-python = ">=3.13"
authors = [
    {name = "Template Author", email = "author@example.com"}
]
readme = "README.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "copier>=9.4",
    "docker>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests requiring Docker daemon",
    "devcontainer: marks tests requiring devcontainer CLI",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = []
