# Copier Template for Modern Python Projects
# Based on analysis of 40+ real-world Python projects
# https://github.com/copier-org/copier
#
# Always included (not configurable):
# - Pyright strict type checking
# - pytest testing infrastructure
# - pre-commit hooks
# - justfile task runner
# - Claude Code integration (.claude/ with commands, agents, skills, MCP servers)
# - rich terminal output
# - Click for CLI
# - Hatchling build system
# - VS Code devcontainer

_min_copier_version: "9.0.0"

_jinja_extensions:
  - extensions.GitConfigContext

# Basic Project Information
project_name:
  type: str
  help: "Project name (human-readable, with spaces/capitals)"
  default: "My Project"

project_slug:
  type: str
  help: "Project slug (URL-friendly, lowercase with hyphens)"
  default: "{{ project_name|lower|replace(' ', '-')|replace('_', '-') }}"

package_name:
  type: str
  help: "Python package name (valid Python identifier)"
  default: "{{ project_slug|replace('-', '_') }}"

description:
  type: str
  help: "Short description of the project"
  default: ""

author_name:
  type: str
  help: "Author name"
  default: "{{ git_user_name }}"

author_email:
  type: str
  help: "Author email"
  default: "{{ git_user_email }}"

# Project Type
project_type:
  type: str
  help: "Project type"
  choices:
    cli: "CLI Tool (command-line application)"
    api: "API Service (FastAPI REST API)"
    library: "Library (distributable package)"
    monorepo: "Monorepo (multiple Python packages via UV workspaces)"
  default: "api"

# Python Configuration
python_version:
  type: str
  help: "Minimum Python version"
  choices:
    "3.12": "Python 3.12 (stable)"
    "3.13": "Python 3.13 (latest, recommended)"
  default: "3.13"

# Infrastructure
use_docker:
  type: bool
  help: "Include Docker/Docker Compose configuration?"
  default: true

database_type:
  type: str
  help: "Database type"
  choices:
    none: "No database"
    postgresql: "PostgreSQL (direct)"
    supabase: "Supabase (PostgreSQL + Auth + Storage)"
    sqlite: "SQLite"
  default: "{{ 'postgresql' if project_type == 'api' else 'none' }}"
  when: "{{ project_type != 'library' }}"

use_alembic:
  type: bool
  help: "Include Alembic for database migrations?"
  default: "{{ database_type == 'postgresql' }}"
  when: "{{ database_type == 'postgresql' }}"

use_supabase_local:
  type: bool
  help: "Run local Supabase stack (docker-compose)?"
  default: true
  when: "{{ database_type == 'supabase' }}"

# Development Tools Configuration
ruff_strictness:
  type: str
  help: "Ruff linting strictness level"
  choices:
    minimal: "Minimal (E, F - essential errors only)"
    recommended: "Recommended (add I, N, UP, B - standard best practices)"
    strict: "Strict (add ALL with opt-outs - maximum safety)"
  default: "recommended"

dependency_pinning:
  type: str
  help: "Dependency version pinning strategy"
  choices:
    flexible: "Flexible (>= with upper bounds ~=)"
    conservative: "Conservative (>= with compatible release)"
    strict: "Strict (== pinned versions)"
  default: "flexible"

# Documentation Configuration
documentation_tier:
  type: str
  help: "Documentation level"
  choices:
    minimal: "Minimal (README + CLAUDE.md only)"
    standard: "Standard (+ code-style guides + agent docs)"
    comprehensive: "Comprehensive (+ architecture diagrams + TodoWrite templates)"
  default: "standard"

# Git Configuration
git_init:
  type: bool
  help: "Initialize git repository?"
  default: true

# Template Configuration
_templates_suffix: ".jinja"
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "extensions.py"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"

_tasks:
  # Post-generation tasks
  - "{% if git_init %}git init{% endif %}"
  - "{% if git_init %}git add .{% endif %}"
  - "{% if git_init %}git commit -m 'Initial commit from template'{% endif %}"
