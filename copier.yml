# Copier Template for Modern Python Projects
# Based on analysis of 40+ real-world Python projects
# https://github.com/copier-org/copier
#
# Always included (not configurable):
# - Docker and VS Code devcontainer (consistent development environment)
# - Pyright strict type checking
# - pytest testing infrastructure
# - pre-commit hooks
# - justfile task runner
# - Claude Code integration (.claude/ with commands, agents, skills, MCP servers)
# - rich terminal output
# - Click for CLI
# - Hatchling build system

_min_copier_version: "9.0.0"

# Basic Project Information
project_name:
  type: str
  help: "Project name (human-readable, with spaces/capitals)"

project_slug:
  type: str
  help: "Project slug (URL-friendly, lowercase with hyphens)"
  default: "{{ project_name|lower|replace(' ', '-')|replace('_', '-') }}"

package_name:
  type: str
  help: "Python package name (valid Python identifier)"
  default: "{{ project_slug|replace('-', '_') }}"

description:
  type: str
  help: "Short description of the project"
  default: ""

license:
  type: str
  help: "Project license"
  choices:
    "Proprietary (All rights reserved)": proprietary
    "MIT License": mit
  default: proprietary

# Project Type
project_type:
  type: str
  help: "Project type"
  choices:
    "CLI Tool (command-line application)": cli
    "API Service (FastAPI REST API)": api
    "Library (distributable package)": library
    "Monorepo (multiple Python packages via UV workspaces)": monorepo
  default: monorepo

# Python Configuration
python_version:
  type: str
  help: "Minimum Python version"
  choices:
    "Python 3.12 (stable)": "3.12"
    "Python 3.13 (latest, recommended)": "3.13"
  default: "3.13"

# Infrastructure
# NOTE: Docker and DevContainers are ALWAYS included (not configurable).
# All projects use Docker Compose for services and VS Code devcontainer
# for consistent development environments.

database_type:
  type: str
  help: "Database type"
  choices:
    "No database": none
    "PostgreSQL (direct)": postgresql
    "Supabase (PostgreSQL + Auth + Storage)": supabase
    "SQLite": sqlite
  default: "{{ 'postgresql' if project_type == 'api' else 'none' }}"
  when: "{{ project_type != 'library' }}"

# User-facing alembic question (only shown for postgresql/sqlite)
_use_alembic_input:
  type: bool
  help: "Include Alembic for database migrations?"
  default: true
  when: "{{ database_type in ['postgresql', 'sqlite'] }}"

# Derived variable - always defined, used in templates
use_alembic:
  type: bool
  default: "{{ _use_alembic_input if database_type in ['postgresql', 'sqlite'] else false }}"
  when: false  # Never prompt, just compute

use_supabase_local:
  type: bool
  help: "Run local Supabase stack (docker-compose)?"
  default: true
  when: "{{ database_type == 'supabase' }}"

# Development Tools Configuration
ruff_strictness:
  type: str
  help: "Ruff linting strictness level"
  choices:
    "Minimal (E, F - essential errors only)": minimal
    "Recommended (add I, N, UP, B - standard best practices)": recommended
    "Strict (add ALL with opt-outs - maximum safety)": strict
  default: recommended

dependency_pinning:
  type: str
  help: "Dependency version pinning strategy"
  choices:
    "Flexible (>= with upper bounds ~=)": flexible
    "Conservative (>= with compatible release)": conservative
    "Strict (== pinned versions)": strict
  default: flexible

# Documentation Configuration
documentation_tier:
  type: str
  help: "Documentation level"
  choices:
    "Minimal (README + CLAUDE.md only)": minimal
    "Standard (+ code-style guides + agent docs)": standard
    "Comprehensive (+ architecture diagrams + TodoWrite templates)": comprehensive
  default: standard

# Git Configuration
git_init:
  type: bool
  help: "Initialize git repository?"
  default: true

# Template Configuration
_subdirectory: template
_templates_suffix: ".jinja"
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"

_tasks:
  # Post-generation tasks
  - "{% if git_init %}git init{% endif %}"
  - "{% if git_init %}git add .{% endif %}"
  - "{% if git_init %}git commit -m 'Initial commit from template'{% endif %}"
